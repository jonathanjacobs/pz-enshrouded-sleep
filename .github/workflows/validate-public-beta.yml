name: Validate Public Beta Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Workshop and runtime structure
        shell: bash
        run: |
          set -euo pipefail

          MOD_ROOT="Contents/mods/pz-enshrouded-sleep"
          RUNTIME_LUA="$MOD_ROOT/42/media/lua"
          NOTIFY_SERVER="$MOD_ROOT/42/media/lua/server/EnshroudedSleep/SleepNotification_Server.lua"
          NOTIFY_CLIENT="$MOD_ROOT/42/media/lua/client/EnshroudedSleep/SleepNotification_Client.lua"
          BENEFIT_SERVER="$MOD_ROOT/42/media/lua/server/EnshroudedSleep/SleepBenefits_Server.lua"
          BENEFIT_CONFIG_DIAG="$MOD_ROOT/42/media/lua/server/EnshroudedSleep/SleepBenefitsConfigDiag_Server.lua"
          BENEFIT_CLIENT="$MOD_ROOT/42/media/lua/client/EnshroudedSleep/SleepBenefits_Client.lua"
          BENEFIT_MOODLE="$MOD_ROOT/42/media/lua/client/EnshroudedSleep/SleepBenefitMoodle_Client.lua"
          SANDBOX_OPTIONS="$MOD_ROOT/42/media/sandbox-options.txt"
          SANDBOX_EN="$MOD_ROOT/42/media/lua/shared/Translate/EN/Sandbox.json"
          MOODLES_EN="$MOD_ROOT/42/media/lua/shared/Translate/EN/Moodles.json"
          RESTED_ICON="$MOD_ROOT/42/media/ui/Moodle_EnshroudedRested.png"
          WELL_RESTED_ICON="$MOD_ROOT/42/media/ui/Moodle_EnshroudedWellRested.png"
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          DEV_BUILD="$VERSION_VALUE+sleep-benefits-server-xp-dev"

          [[ "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f workshop.txt
          test -f workshop-description.bbcode
          test -f preview.png
          test -d "$MOD_ROOT/common"
          test -d "$MOD_ROOT/42"
          test -f "$MOD_ROOT/mod.info"
          test -f "$MOD_ROOT/42/mod.info"
          test -f "$MOD_ROOT/42/poster.png"
          test -f "$MOD_ROOT/42/icon.png"
          test -f "$SANDBOX_OPTIONS"
          test -f "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/AwakePlayerProtection_Server.lua"
          test -f "$NOTIFY_SERVER"
          test -f "$NOTIFY_CLIENT"
          test -f "$BENEFIT_SERVER"
          test -f "$BENEFIT_CONFIG_DIAG"
          test -f "$BENEFIT_CLIENT"
          test -f "$BENEFIT_MOODLE"
          test -f "$SANDBOX_EN"
          test -f "$MOODLES_EN"
          test -f "$RESTED_ICON"
          test -f "$WELL_RESTED_ICON"
          test ! -e "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/AwakePlayerProtectionPrototype_Server.lua"

          test -f "$MOD_ROOT/common/media/AnimSets/.gitkeep"
          test -f "$MOD_ROOT/common/media/actiongroups/.gitkeep"
          test -f "$MOD_ROOT/42/media/AnimSets/.gitkeep"
          test -f "$MOD_ROOT/42/media/actiongroups/.gitkeep"

          test ! -e 42
          test ! -e common
          test ! -e mod.info

          grep -Fxq "id=pz-enshrouded-sleep" "$MOD_ROOT/mod.info"
          grep -Fxq "id=pz-enshrouded-sleep" "$MOD_ROOT/42/mod.info"
          grep -Fxq "modversion=$VERSION_VALUE" "$MOD_ROOT/mod.info"
          grep -Fxq "modversion=$VERSION_VALUE" "$MOD_ROOT/42/mod.info"
          grep -Fq "Public Beta" "$MOD_ROOT/mod.info"
          grep -Fq "Public Beta" "$MOD_ROOT/42/mod.info"
          grep -Fq "Public Beta" README.md
          grep -Fq "Current version: **v$VERSION_VALUE**" README.md
          grep -Fq "Validated Project Zomboid baseline: **42.20.4**" README.md
          grep -Fq "Version:[/b] $VERSION_VALUE" workshop-description.bbcode
          grep -Fq "Tested with:[/b] Project Zomboid 42.20.4" workshop-description.bbcode
          grep -Fxq "id=3786842301" workshop.txt
          grep -Fxq "title=Enshrouded Sleep - Public Beta" workshop.txt
          grep -Fq "description=Public Beta v$VERSION_VALUE " workshop.txt
          grep -Fxq "tags=Build 42;Multiplayer" workshop.txt
          grep -Fxq "visibility=public" workshop.txt

          grep -Fq 'option EnshroudedSleep.AwakePlayerProtectionEnabled' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.SleepNotificationsEnabled' "$SANDBOX_OPTIONS"
          grep -A6 -F 'option EnshroudedSleep.SleepNotificationsEnabled' "$SANDBOX_OPTIONS" | grep -Fq 'default = false'
          grep -Fq 'option EnshroudedSleep.SleepBenefitsEnabled' "$SANDBOX_OPTIONS"
          grep -A6 -F 'option EnshroudedSleep.SleepBenefitsEnabled' "$SANDBOX_OPTIONS" | grep -Fq 'default = false'
          grep -Fq 'option EnshroudedSleep.RestedMinimumSleepHours' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.RestedDurationHours' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.RestedXPBonusPercent' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.WellRestedMinimumSleepHours' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.WellRestedDurationHours' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.WellRestedXPBonusPercent' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.WellRestedEnduranceRecoveryBonusPercent' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.DiagnosticsEnabled' "$SANDBOX_OPTIONS"
          grep -Fq 'option EnshroudedSleep.DiagnosticForcedCompressionFactor' "$SANDBOX_OPTIONS"
          ! grep -Fq 'DiagnosticAwakeProtectionPrototype' "$SANDBOX_OPTIONS"

          # Every custom option must explicitly bind its translated display label.
          for option in \
            Enabled PartialSleepSpeedScale AwakePlayerProtectionEnabled SleepNotificationsEnabled \
            SleepBenefitsEnabled RestedMinimumSleepHours RestedDurationHours RestedXPBonusPercent \
            WellRestedMinimumSleepHours WellRestedDurationHours WellRestedXPBonusPercent \
            WellRestedEnduranceRecoveryBonusPercent DiagnosticsEnabled DiagnosticForcedCompressionFactor
          do
            grep -A8 -F "option EnshroudedSleep.$option" "$SANDBOX_OPTIONS" \
              | grep -Fq "translation = EnshroudedSleep_$option"
            grep -Fq "\"Sandbox_EnshroudedSleep_$option\"" "$SANDBOX_EN"
          done

          grep -Fq "Loaded Public Beta v$VERSION_VALUE awake-player survival protection." "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/AwakePlayerProtection_Server.lua"
          grep -Fq "Loaded Public Beta v$VERSION_VALUE multiplayer-server calendar-compression controller." "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/EnshroudedSleep_Server.lua"
          grep -Fq "Loaded Public Beta v$VERSION_VALUE authoritative MinutesPerDay replication." "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/ClockStateSync_Server.lua"
          grep -Fq "Loaded Public Beta v$VERSION_VALUE client MinutesPerDay synchronization." "$MOD_ROOT/42/media/lua/client/EnshroudedSleep/ClockStateSync_Client.lua"
          grep -Fq "Loaded sleep-status broadcaster | build=" "$NOTIFY_SERVER"
          grep -Fq "Loaded sleep-status banner | build=" "$NOTIFY_CLIENT"
          grep -Fq "buildVersion = \"$VERSION_VALUE\"" "$MOD_ROOT/42/media/lua/server/EnshroudedSleep/ClockStateSync_Server.lua"
          grep -Fq "BUILD_VERSION = \"$DEV_BUILD\"" "$NOTIFY_SERVER"
          grep -Fq "BUILD_VERSION = \"$DEV_BUILD\"" "$NOTIFY_CLIENT"
          grep -Fq "SleepNotificationsEnabled=true" "$NOTIFY_SERVER"
          grep -Fq "CONFIG | build=" "$NOTIFY_SERVER"
          grep -Fq "World time is %s faster." "$NOTIFY_SERVER"
          grep -Fq 'require "ISUI/ISUIElement"' "$NOTIFY_CLIENT"
          grep -Fq 'EnshroudedSleepNotificationBanner' "$NOTIFY_CLIENT"
          grep -Fq 'BUILD_MISMATCH' "$NOTIFY_CLIENT"
          grep -Fq 'UI_DISABLED' "$NOTIFY_CLIENT"
          if grep -Fq 'showServerChatMessage' "$NOTIFY_CLIENT"; then
            echo "ERROR: inaccessible ChatManager notification bridge reintroduced"
            exit 1
          fi

          # Sleep benefits are an unreleased, independently disabled feature on this branch.
          grep -Fq "SleepBenefitsEnabled" "$BENEFIT_SERVER"
          grep -Fq "getWorldAgeHours" "$BENEFIT_SERVER"
          grep -Fq 'resolveCharacterStat("ENDURANCE", "Endurance")' "$BENEFIT_SERVER"
          grep -Fq "buildVersion = \"$DEV_BUILD\"" "$BENEFIT_SERVER"
          grep -Fq "BUILD_VERSION = \"$DEV_BUILD\"" "$BENEFIT_CLIENT"
          grep -Fq 'BUILD_MISMATCH' "$BENEFIT_CLIENT"
          grep -Fq 'CONFIG | build=' "$BENEFIT_CONFIG_DIAG"
          grep -Fq "BUILD_VERSION = \"$DEV_BUILD\"" "$BENEFIT_CONFIG_DIAG"
          grep -Fq "addXpNoMultiplier" "$BENEFIT_SERVER"
          grep -Fq "Events.AddXP.Add" "$BENEFIT_SERVER"
          grep -Fq "XP_BONUS | player=" "$BENEFIT_SERVER"
          if grep -Fq "Events.AddXP" "$BENEFIT_CLIENT" || grep -Fq "addXpNoMultiplier" "$BENEFIT_CLIENT"; then
            echo "ERROR: client-authoritative sleep-benefit XP path reintroduced"
            exit 1
          fi
          grep -Fq 'require "EnshroudedSleep/SleepBenefitMoodle_Client"' "$BENEFIT_CLIENT"
          grep -Fq 'require "ISUI/ISUIElement"' "$BENEFIT_MOODLE"
          grep -Fq 'getOptionMoodleSize' "$BENEFIT_MOODLE"
          grep -Fq '_Moodles_BGsolid.png' "$BENEFIT_MOODLE"
          grep -Fq '_Moodles_BGoutline.png' "$BENEFIT_MOODLE"
          grep -Fq 'UI_DISABLED' "$BENEFIT_MOODLE"
          grep -Fq 'Moodles_EnshroudedRested' "$MOODLES_EN"
          grep -Fq 'Moodles_EnshroudedWellRested' "$MOODLES_EN"
          grep -Fq "SPIKE-007" docs/spikes/SPIKE-007-sleep-benefits.md
          grep -Fq 'Default 5%%.' "$SANDBOX_EN"
          grep -Fq 'Default 10%%.' "$SANDBOX_EN"
          grep -Fq '(50%%).' "$SANDBOX_EN"
          if grep -RFq 'MF_ISMoodle' "$BENEFIT_CLIENT" "$BENEFIT_MOODLE"; then
            echo "ERROR: external Moodle Framework runtime dependency reintroduced"
            exit 1
          fi

          # Keep the current public/admin notification examples synchronized with the released runtime wording.
          grep -Fq "World time is 20x faster." README.md
          grep -Fq "World time is 20x faster." workshop-description.bbcode
          grep -Fq "World time is 20x faster." "$SANDBOX_EN"
          grep -Fq "World time is 20x faster." docs/DEPLOYMENT.md
          grep -Fq "World time is 20x faster." docs/TESTING.md
          grep -Fq "World time is 20x faster." docs/REQUIREMENTS.md
          grep -Fq "World time is 20x faster." CHANGELOG.md

          # Every current release banner in runtime Lua must agree with VERSION.
          mapfile -t runtime_release_labels < <(
            grep -RhoE 'Public (Alpha|Beta) v[0-9]+\.[0-9]+\.[0-9]+' "$RUNTIME_LUA" | sort -u || true
          )
          test "${#runtime_release_labels[@]}" -gt 0
          for label in "${runtime_release_labels[@]}"; do
            if [[ "$label" != "Public Beta v$VERSION_VALUE" ]]; then
              echo "ERROR: stale runtime release label found: $label (expected Public Beta v$VERSION_VALUE)"
              exit 1
            fi
          done

          # PZ 42.20.4 removed dynamic loadstring/loadstream execution. Enshrouded
          # Sleep uses predefined command handlers and structured arguments only.
          if grep -RFnE '(^|[^[:alnum:]_])(loadstring|loadstream)([^[:alnum:]_]|$)' "$RUNTIME_LUA"; then
            echo "ERROR: removed dynamic-code API referenced by runtime Lua"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import struct
          expected = {
              Path("preview.png"): (256, 256),
              # Current Project Zomboid mod-manager poster artwork is intentionally
              # 743x743; do not silently resize it as part of a code release.
              Path("Contents/mods/pz-enshrouded-sleep/42/poster.png"): (743, 743),
              Path("Contents/mods/pz-enshrouded-sleep/42/icon.png"): (32, 32),
              # Current SPIKE-007 art is 30x30 RGBA and the self-contained renderer
              # scales it to the configured B42 Moodle slot size. Higher-resolution
              # masters may replace these after visual validation without changing
              # the runtime contract.
              Path("Contents/mods/pz-enshrouded-sleep/42/media/ui/Moodle_EnshroudedRested.png"): (30, 30),
              Path("Contents/mods/pz-enshrouded-sleep/42/media/ui/Moodle_EnshroudedWellRested.png"): (30, 30),
          }
          for path, wanted in expected.items():
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{path} is not a PNG"
              assert data[12:16] == b"IHDR", f"{path} has no PNG IHDR"
              actual = struct.unpack(">II", data[16:24])
              assert actual == wanted, f"{path}: expected {wanted}, got {actual}"
              if path.name.startswith("Moodle_Enshrouded"):
                  assert data[25] == 6, f"{path}: expected RGBA PNG color type 6, got {data[25]}"
          assert Path("preview.png").stat().st_size <= 1000 * 1024
          PY

          echo "Public Beta package structure/version/artwork/compatibility checks passed for v$VERSION_VALUE."
