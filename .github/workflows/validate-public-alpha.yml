name: Validate Public Alpha Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Workshop and runtime structure
        shell: bash
        run: |
          set -euo pipefail

          MOD_ROOT="Contents/mods/pz-enshrouded-sleep"
          LUA_ROOT="$MOD_ROOT/42/media/lua"
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"

          [[ "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f workshop.txt
          test -f preview.png
          test -d "$MOD_ROOT/common"
          test -d "$MOD_ROOT/42"
          test -f "$MOD_ROOT/mod.info"
          test -f "$MOD_ROOT/42/mod.info"
          test -f "$MOD_ROOT/42/poster.png"
          test -f "$MOD_ROOT/42/icon.png"
          test -f "$MOD_ROOT/42/media/sandbox-options.txt"

          # These empty directories are intentionally retained for the Build 42
          # mod-media scanner workaround validated during development.
          test -f "$MOD_ROOT/common/media/AnimSets/.gitkeep"
          test -f "$MOD_ROOT/common/media/actiongroups/.gitkeep"
          test -f "$MOD_ROOT/42/media/AnimSets/.gitkeep"
          test -f "$MOD_ROOT/42/media/actiongroups/.gitkeep"

          # The deployable mod must exist only under Contents/mods; duplicate
          # root-level runtime trees create source/publication drift.
          test ! -e 42
          test ! -e common
          test ! -e mod.info

          grep -Fxq "id=pz-enshrouded-sleep" "$MOD_ROOT/mod.info"
          grep -Fxq "id=pz-enshrouded-sleep" "$MOD_ROOT/42/mod.info"
          grep -Fxq "modversion=$VERSION_VALUE" "$MOD_ROOT/mod.info"
          grep -Fxq "modversion=$VERSION_VALUE" "$MOD_ROOT/42/mod.info"
          grep -Fxq "poster=poster.png" "$MOD_ROOT/42/mod.info"
          grep -Fxq "icon=icon.png" "$MOD_ROOT/42/mod.info"

          # Validate PNG identity and the publication dimensions used by this
          # repository. preview.png also has an uploader-enforced 1000 KB ceiling.
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              Path("preview.png"): (256, 256),
              Path("Contents/mods/pz-enshrouded-sleep/42/poster.png"): (256, 256),
              Path("Contents/mods/pz-enshrouded-sleep/42/icon.png"): (32, 32),
          }

          for path, wanted in expected.items():
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{path} is not a PNG"
              assert data[12:16] == b"IHDR", f"{path} has no PNG IHDR"
              actual = struct.unpack(">II", data[16:24])
              assert actual == wanted, f"{path}: expected {wanted}, got {actual}"

          assert Path("preview.png").stat().st_size <= 1000 * 1024, "preview.png exceeds 1000 KB"
          PY

          # Public startup banners should identify the package being tested. The
          # comments may retain older version history, but live banners should not.
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/server/EnshroudedSleep/EnshroudedSleep_Server.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/server/EnshroudedSleep/ClockStateSync_Server.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/client/EnshroudedSleep/ClockStateSync_Client.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/server/EnshroudedSleep/ClockSyncDiagnostic_Server.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/client/EnshroudedSleep/ClockSyncDiagnostic_Client.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/server/EnshroudedSleep/HealthTimeDomainDiagnostic_Server.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/client/EnshroudedSleep/HealthTimeDomainDiagnostic_Client.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/server/EnshroudedSleep/SurvivalStatDiagnostic_Server.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/client/EnshroudedSleep/SurvivalStatDiagnostic_Client.lua"
          grep -Fq "Public Alpha v$VERSION_VALUE" "$LUA_ROOT/shared/EnshroudedSleep/SurvivalStatProbe.lua"
          grep -Fq "buildVersion = \"$VERSION_VALUE\"" "$LUA_ROOT/server/EnshroudedSleep/ClockStateSync_Server.lua"

          grep -Fq 'option EnshroudedSleep.DiagnosticsEnabled' "$MOD_ROOT/42/media/sandbox-options.txt"
          grep -Fq 'default = false' "$MOD_ROOT/42/media/sandbox-options.txt"
          grep -Fq 'option EnshroudedSleep.DiagnosticForcedCompressionFactor' "$MOD_ROOT/42/media/sandbox-options.txt"
          grep -Fq 'default = 1.0' "$MOD_ROOT/42/media/sandbox-options.txt"

          echo "Public Alpha package structure/version/artwork checks passed for v$VERSION_VALUE."
