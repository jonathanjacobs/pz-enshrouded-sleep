name: Validate Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate package layout, versions, translations, and artwork
        run: bash tools/validate-package.sh

  lua-syntax:
    name: Check Lua syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install the Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check that every Lua file parses as Lua 5.1
        run: bash tools/check-lua-syntax.sh --require-compiler
